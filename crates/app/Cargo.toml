[package]
name = "dasmeter-app"
description = "The Das-Meter app: platform shell and Meter renderers"
version.workspace = true
edition.workspace = true
rust-version = "1.95" # egui 0.36
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "das-meter"
path = "src/main.rs"

[dependencies]
bytemuck = "1.25.2"
cpal = "0.18"
dasmeter-analysis = { path = "../analysis" }
dasmeter-core = { path = "../core" }
dasmeter-transport = { path = "../transport" }
egui = { version = "0.36", default-features = false }
egui-wgpu = { version = "0.36", default-features = false }
egui-winit = { version = "0.36", default-features = false, features = ["links"] }
glyphon = "0.12"
pollster = "1.0.1"
raw-window-handle = "0.6"
rfd = { version = "0.17", default-features = false }
rtrb = "0.4.0"
wgpu = "30"
winit = "0.30.13"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Self-update (ADR 0004): the release signature and GitHub's release JSON.
minisign-verify = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
muda = { version = "0.20", default-features = false }
# The menu bar icon (first launch: always there, so the app stays reachable without a Dock icon).
tray-icon = { version = "0.25", default-features = false }
objc2 = "0.6"
# Launch at login (SMAppService, macOS 13+).
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSScreen", "NSWindow", "NSView", "NSResponder", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSFileManager", "NSGeometry", "NSString", "NSURL"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Signs test data for the update's signature checks.
minisign = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
# System Capture through PipeWire, which records what plays on the default
# output (cpal picks it over ALSA when PipeWire runs).
cpal = { version = "0.18", features = ["pipewire"] }
# File dialogs through the desktop's portal; X11 and Wayland windows.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
egui-winit = { version = "0.36", default-features = false, features = ["links", "wayland", "x11"] }

[target."cfg(unix)".dependencies]
libc = "0.2"
