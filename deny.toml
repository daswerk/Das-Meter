# cargo-deny: licence, advisory, ban and source checks, run in CI on every PR.
# Das-Meter is MIT OR Apache-2.0, so only licences compatible with that are allowed.
# Add a licence here only after checking it is compatible (see CLAUDE.md).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained (no fix, no vulnerability). It comes in through
    # glyphon's font database, winit's Linux decorations and egui's font
    # rendering (ab_glyph, in the Send Plugin window), with no maintained
    # release of any that avoids it yet. Drop this when they move to skrifa.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, no alternative in glyphon 0.12 / winit 0.30 / egui 0.33" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# The list covers licences we expect to meet as dependencies are added.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates use path dependencies without versions.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The Send Plugin's window: neither crate is published on crates.io.
allow-git = [
    "https://github.com/RustAudio/baseview.git",
    "https://github.com/BillyDM/egui-baseview.git",
]
