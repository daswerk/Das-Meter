# cargo-deny: licence, advisory, ban and source checks, run in CI on every PR.
# Das-Meter is MIT OR Apache-2.0, so only licences compatible with that are allowed.
# Add a licence here only after checking it is compatible (see CLAUDE.md).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained (no fix, no vulnerability). It comes in through
    # glyphon's font database, winit's Linux decorations and egui's font
    # rendering (ab_glyph, in the Send Plugin window), with no maintained
    # release of any that avoids it yet. Drop this when they move to skrifa.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, no alternative in glyphon 0.12 / winit 0.30 / egui 0.33" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# The list covers licences we expect to meet as dependencies are added.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# MPL-2.0 for Symphonia alone, which decodes audio files for the Tonal Balance
# Meter (ADR 0006). File-level copyleft: we use it unmodified as a library.
# No other crate may bring MPL-2.0 in without its own decision.
exceptions = [
    { allow = ["MPL-2.0"], crate = "symphonia" },
    { allow = ["MPL-2.0"], crate = "symphonia-bundle-flac" },
    { allow = ["MPL-2.0"], crate = "symphonia-bundle-mp3" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-aac" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-alac" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-pcm" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-vorbis" },
    { allow = ["MPL-2.0"], crate = "symphonia-common" },
    { allow = ["MPL-2.0"], crate = "symphonia-core" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-caf" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-isomp4" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-ogg" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-riff" },
    { allow = ["MPL-2.0"], crate = "symphonia-metadata" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates use path dependencies without versions.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The Send Plugin's window: neither crate is published on crates.io.
allow-git = [
    "https://github.com/RustAudio/baseview.git",
    "https://github.com/BillyDM/egui-baseview.git",
]
