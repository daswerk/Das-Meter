[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Das Werk"]
repository = "https://github.com/daswerk/Das-Meter"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The golden tests push minutes of audio through the analysers; unoptimised,
# they take over a minute. Optimise the maths even in debug builds.
[profile.dev.package.ebur128]
opt-level = 3

[profile.dev.package.dasmeter-analysis]
opt-level = 3
