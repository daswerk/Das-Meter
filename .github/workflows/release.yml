name: Release

# Pushing a v* tag builds the universal macOS app, signs it, and attaches the
# DMG, the update tarball and its minisign signature to a draft Release; then
# a Linux x86_64 executable (built on Ubuntu, for Arch and other current
# distributions) is added to the same draft
# (ADR 0004), and the Windows installer with its minisign signature (#46).
# A tag with a suffix (v0.1.0-test1) makes a pre-release, for dry runs.
#
# Secrets and variables live in the `release` environment, which needs the
# owner's approval to run (Settings ▸ Environments ▸ release):
# - MACOS_CERTIFICATE (secret): the self-made code-signing certificate and its
#   key, as a base64 .p12. MACOS_CERTIFICATE_PASSWORD (secret): its password.
# - CERTIFICATE_SHA1 (variable): that certificate's SHA-1, built into the app
#   so it only accepts updates signed with it.
# - MINISIGN_SECRET_KEY (secret): the minisign secret key file's text, from
#   `minisign -G -W` (no password). MINISIGN_PUBLIC_KEY (variable): the
#   public key's base64 line, built into the app.
# - Notarization switches on once APPLE_DEVELOPER_ID_CERTIFICATE,
#   APPLE_DEVELOPER_ID_PASSWORD, APPLE_ID, APPLE_TEAM_ID and
#   APPLE_APP_PASSWORD exist; the Developer ID then signs instead.
# Without the certificate the app is signed ad hoc and can't update itself.
# - Windows signing (SignPath Foundation) switches on once SIGNPATH_API_TOKEN
#   (secret) and the variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG
#   and SIGNPATH_SIGNING_POLICY_SLUG exist. The SignPath project needs two
#   artifact configurations: `binaries` (a zip holding das-meter.exe, the
#   .clap file and the .vst3 folder; sign every PE file in it) and
#   `installer` (a zip holding the setup .exe; sign it). Until then the
#   installer ships unsigned and SmartScreen asks once. The app's own Update
#   checks the installer's minisign signature either way.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS app, DMG and update tarball
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      # Compiled dependencies from the last release: most of the build time.
      - uses: Swatinem/rust-cache@v2

      - name: Version from the tag
        id: version
        run: |
          tag=${GITHUB_REF_NAME}
          version=$(cargo pkgid -p dasmeter-app | sed 's/.*[#@]//')
          if [[ ${tag#v} != "$version" && ${tag#v} != "$version"-* ]]; then
            echo "::error::tag $tag doesn't match the app's version $version"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          [[ $tag == *-* ]] && echo "prerelease=true" >>"$GITHUB_OUTPUT" || echo "prerelease=false" >>"$GITHUB_OUTPUT"

      - name: Signing identity
        id: identity
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
        run: |
          # A Developer ID, once there is one, else our own certificate, else ad hoc.
          p12=$DEVELOPER_ID; password=$DEVELOPER_ID_PASSWORD
          if [[ -z $p12 ]]; then p12=$CERTIFICATE; password=$CERTIFICATE_PASSWORD; fi
          if [[ -z $p12 ]]; then
            echo "::warning::no signing certificate: signing ad hoc; this build can't update itself"
            echo "identity=-" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          keychain=$RUNNER_TEMP/release.keychain-db
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$p12" | base64 --decode >"$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$password" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          sha1=$(security find-certificate -a -Z "$keychain" | awk '/SHA-1/ { print $3; exit }')
          if [[ -z $DEVELOPER_ID ]]; then
            # A self-made certificate isn't trusted for code signing until we say so.
            security find-certificate -a -p "$keychain" >"$RUNNER_TEMP/certificate.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign \
              -k /Library/Keychains/System.keychain "$RUNNER_TEMP/certificate.pem"
          fi
          echo "identity=$sha1" >>"$GITHUB_OUTPUT"

      - name: Build the app (universal, Send Plugin inside)
        env:
          IDENTITY: ${{ steps.identity.outputs.identity }}
          DASMETER_MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
          DASMETER_CERTIFICATE_SHA1: ${{ vars.CERTIFICATE_SHA1 }}
        run: |
          # Unset variables must not build in an empty key.
          [[ -n $DASMETER_MINISIGN_PUBLIC_KEY ]] || unset DASMETER_MINISIGN_PUBLIC_KEY
          [[ -n $DASMETER_CERTIFICATE_SHA1 ]] || unset DASMETER_CERTIFICATE_SHA1
          scripts/macos-bundle.sh --universal dist
          lipo -archs dist/Das-Meter.app/Contents/MacOS/das-meter
          codesign --verify --deep --strict --verbose=2 dist/Das-Meter.app

      - name: Notarize (once the Developer ID secrets exist)
        env:
          DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z $DEVELOPER_ID || -z $APPLE_ID ]]; then
            echo "No Developer ID yet: skipping notarization (ADR 0004)."
            exit 0
          fi
          ditto -c -k --keepParent dist/Das-Meter.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple dist/Das-Meter.app

      - name: DMG and update tarball
        env:
          IDENTITY: ${{ steps.identity.outputs.identity }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ $IDENTITY == - ]]; then unset IDENTITY; fi
          scripts/macos-dmg.sh dist/Das-Meter.app "dist/Das-Meter-$VERSION.dmg"
          COPYFILE_DISABLE=1 tar -czf "dist/Das-Meter-$VERSION.app.tar.gz" -C dist Das-Meter.app

      - name: Sign the tarball (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z $MINISIGN_SECRET_KEY ]]; then
            echo "::warning::no minisign key: the tarball is unsigned and apps won't install it"
            exit 0
          fi
          brew install minisign
          echo "$MINISIGN_SECRET_KEY" >"$RUNNER_TEMP/minisign.key"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m "dist/Das-Meter-$VERSION.app.tar.gz" \
            -t "Das-Meter $VERSION"
          rm "$RUNNER_TEMP/minisign.key"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--draft --title "Das-Meter $VERSION" --generate-notes)
          [[ $PRERELEASE == true ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/Das-Meter-"$VERSION".*

  linux:
    name: Linux executable (x86_64)
    needs: macos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies (ALSA, PipeWire, X11/Wayland)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libclang-dev pkg-config \
            libxkbcommon-dev libwayland-dev
      - name: Build
        run: cargo build --release --locked -p dasmeter-app
      - name: Package
        id: package
        run: |
          version=$(cargo pkgid -p dasmeter-app | sed 's/.*[#@]//')
          dir="das-meter-$version-linux-x86_64"
          mkdir -p "dist/$dir"
          cp target/release/das-meter "dist/$dir/"
          strip "dist/$dir/das-meter"
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.md "dist/$dir/"
          cat >"dist/$dir/README.txt" <<TEXT
          Das-Meter $version for Linux (x86_64)

          Run ./das-meter. System Capture needs PipeWire (the default on Arch,
          Fedora and current Ubuntu); the app also needs Vulkan or OpenGL.
          Docs: https://daswerk.github.io/Das-Meter/
          TEXT
          tar -czf "dist/$dir.tar.gz" -C dist "$dir"
          echo "file=dist/$dir.tar.gz" >>"$GITHUB_OUTPUT"
      - name: Add it to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.package.outputs.file }}" --clobber

  windows:
    name: Windows installer (x64)
    needs: macos
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the app and the Send Plugin
        shell: bash
        env:
          DASMETER_MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: |
          [[ -n $DASMETER_MINISIGN_PUBLIC_KEY ]] || unset DASMETER_MINISIGN_PUBLIC_KEY
          cargo build --release --locked -p dasmeter-app
          scripts/bundle-send-plugin.sh
          version=$(cargo pkgid -p dasmeter-app | sed 's/.*[#@]//')
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - name: Signing (SignPath, once it's set up)
        id: signing
        shell: bash
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [[ -n $TOKEN ]]; then
            echo "on=true" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::no SignPath token: the Windows installer ships unsigned"
          fi
      - name: Stage the binaries for signing
        if: steps.signing.outputs.on == 'true'
        shell: bash
        run: |
          mkdir -p unsigned
          cp target/release/das-meter.exe unsigned/
          cp "target/plugins/Das-Meter Send.clap" unsigned/
          cp -R "target/plugins/Das-Meter Send.vst3" unsigned/
      - name: Upload the binaries
        if: steps.signing.outputs.on == 'true'
        id: binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries-unsigned
          path: unsigned/
          if-no-files-found: error
      - name: Sign the binaries
        if: steps.signing.outputs.on == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.binaries.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Put the signed binaries in place
        if: steps.signing.outputs.on == 'true'
        shell: bash
        run: |
          cp signed/das-meter.exe target/release/
          cp "signed/Das-Meter Send.clap" target/plugins/
          rm -rf "target/plugins/Das-Meter Send.vst3"
          cp -R "signed/Das-Meter Send.vst3" target/plugins/

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DRoot=$PWD" installer\windows\das-meter.iss 2>&1 | Tee-Object -Variable output
          if ($LASTEXITCODE -ne 0) {
            # The compiler's error, where the job summary shows it.
            $output | Select-String -Pattern 'Error|Line \d+' | ForEach-Object { Write-Output "::error::$_" }
            exit $LASTEXITCODE
          }

      - name: Upload the installer
        if: steps.signing.outputs.on == 'true'
        id: installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-unsigned
          path: target/installer/*.exe
          if-no-files-found: error
      - name: Sign the installer
        if: steps.signing.outputs.on == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer
      - name: Put the signed installer in place
        if: steps.signing.outputs.on == 'true'
        shell: bash
        run: cp signed-installer/*.exe target/installer/

      - name: Add it to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "target/installer/Das-Meter-$VERSION-windows-x64-setup.exe" --clobber

  windows-signature:
    # The app's Update checks the installer against the release key, as on
    # macOS; minisign is at hand on Linux.
    name: Windows installer's minisign signature
    needs: windows
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Sign the installer (minisign)
        env:
          GH_TOKEN: ${{ github.token }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [[ -z $MINISIGN_SECRET_KEY ]]; then
            echo "::warning::no minisign key: the installer is unsigned and apps won't install it"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y minisign
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*-windows-x64-setup.exe'
          installer=$(ls *-windows-x64-setup.exe)
          echo "$MINISIGN_SECRET_KEY" >"$RUNNER_TEMP/minisign.key"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$installer" -t "Das-Meter ${installer}"
          rm "$RUNNER_TEMP/minisign.key"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "$installer.minisig" --clobber
