name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies (ALSA, PipeWire, X11/Wayland; X11/XCB/GL for the Send Plugin's window)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libclang-dev pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev libx11-xcb-dev libxcursor-dev \
            libxcb1-dev libxcb-icccm4-dev libgl1-mesa-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Microbenchmarks
        run: cargo bench --workspace --locked
      - name: Send Plugin bundles (CLAP and VST3, plus AU on macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: scripts/bundle-send-plugin.sh
      - name: Validate the AU
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "target/plugins/Das-Meter Send.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx DmSd DsWk

  windows-installer:
    name: Windows test installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the app
        run: cargo build --release --locked -p dasmeter-app
      - name: Send Plugin bundles (CLAP and VST3)
        shell: bash
        run: scripts/bundle-send-plugin.sh
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = (cargo pkgid -p dasmeter-app) -replace '.*[#@]', ''
          & $iscc "/DAppVersion=$version" "/DRoot=$PWD" installer\windows\das-meter.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Das-Meter-windows-x64-setup
          path: target/installer/*.exe
          if-no-files-found: error

  dependencies:
    name: Licences and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: dtolnay/rust-toolchain@stable
      - name: Headless crates stay free of platform, GPU and audio-device code
        run: scripts/check-headless-deps.sh
      - name: THIRD-PARTY-LICENSES.md is up to date
        run: python3 scripts/third-party-licenses.py --check
