name: Docs

# Builds the docs site (docs/site, mdBook) on pull requests that touch it, and
# publishes it to GitHub Pages from main. Pages must be set to "GitHub
# Actions" once (Settings ▸ Pages ▸ Source).

on:
  push:
    branches: [main]
    paths: ["docs/site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["docs/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.52
      - run: mdbook build docs/site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/site/book

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
